name: Gitea -> GitHub Squash Sync (PR Ready)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  squash_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last synced commit from cache
        id: restore_cache
        uses: actions/cache@v3
        with:
          path: last_gitea_main.txt
          key: gitea-main-last-commit

      - name: Add Gitea remote
        run: |
          git remote add gitea ${{ secrets.GITEA_REPO_URL }}
          git fetch gitea main

      - name: Check out gitea_sync branch
        run: |
          git fetch origin gitea_sync
          git checkout -B gitea_sync origin/gitea_sync || git checkout -b gitea_sync

      - name: Check for new commits in Gitea
        id: check_commits
        run: |
          GITEA_HEAD=$(git rev-parse gitea/main)
          echo "GITEA_HEAD=$GITEA_HEAD" >> $GITHUB_ENV

          if [ -f last_gitea_main.txt ]; then
            LAST_HEAD=$(cat last_gitea_main.txt)
            if [ "$LAST_HEAD" = "$GITEA_HEAD" ]; then
              echo "No new commits in Gitea main, exiting."
              exit 0
            fi
          fi

      - name: Configure Git identity
        run: |
          git config user.name "Gitea Sync Bot"
          git config user.email "github@loclhst.com"

      - name: Squash Gitea changes on top of gitea_sync (auto-resolve conflicts)
        run: |
          git merge --squash -X theirs gitea/main
          if ! git diff --cached --quiet; then
            git commit -m "Automated import from Gitea (conflicts auto-resolved)"
          else
            echo "No changes to commit."
          fi

      - name: Push gitea_sync branch using fine-grained PAT
        run: |
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} gitea_sync --force

      - name: Update last synced commit cache
        run: |
          echo $GITEA_HEAD > last_gitea_main.txt

      - name: Cache last synced commit
        uses: actions/cache@v3
        with:
          path: last_gitea_main.txt
          key: gitea-main-last-commit

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh

      - name: Create or update PR from gitea_sync -> main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr list --head gitea_sync --base main --state open --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            gh pr create --head gitea_sync --base main --title "Automated sync from Gitea" --body "This PR contains the latest squashed changes from Gitea main branch."
            echo "PR created."
          else
            echo "PR already exists: $PR_URL"
